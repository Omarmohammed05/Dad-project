<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الأداء العائلي - عرض فقط</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07); --gold: #f5c842; --green: #4ade80;
    --text: #f0f0f8; --text-dim: #8888aa;
    --omar: #6c8fff; --mariam: #ff6ca8; --boudy: #4ade80;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 50px; }
  nav { position: sticky; top: 0; z-index: 100; background: rgba(10,10,15,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .nav-tabs { display: flex; gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; }
  .nav-tab { padding: 8px 16px; border: none; border-radius: 9px; background: transparent; color: var(--text-dim); cursor: pointer; font-weight: 600; transition: 0.3s; }
  .nav-tab.active[data-profile="omar"] { background: rgba(108,143,255,0.2); color: var(--omar); }
  .nav-tab.active[data-profile="mariam"] { background: rgba(255,108,168,0.2); color: var(--mariam); }
  .nav-tab.active[data-profile="boudy"] { background: rgba(74,222,128,0.2); color: var(--boudy); }

  main { max-width: 900px; margin: 0 auto; padding: 20px; }
  .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
  .avatar { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; background: var(--surface2); border: 2px solid var(--border); }
  .profile-name { font-size: 28px; font-weight: 900; }

  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-bottom: 30px; }

  .history-item { background: var(--surface2); padding: 12px 20px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
  
  .progress-container { flex: 1; min-width: 200px; }
  .progress-bg { height: 10px; background: #222; border-radius: 5px; overflow: hidden; margin-top: 10px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), #ffecb3); transition: 0.5s; }

  #loading { display: none; text-align: center; color: var(--gold); font-size: 18px; padding: 20px; font-weight: bold; }
  
  /* شارة للمشاهدة فقط */
  .readonly-badge { background: rgba(245, 200, 66, 0.1); color: var(--gold); padding: 4px 8px; border-radius: 6px; font-size: 12px; border: 1px solid var(--gold); }
</style>
</head>
<body>

<nav>
  <div style="font-weight:900; color:var(--gold); display:flex; align-items:center; gap:10px;">
    🏆 الأداء العائلي 
    <span class="readonly-badge">عرض فقط</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-profile="omar" onclick="switchProfile('omar')">عمر</button>
    <button class="nav-tab" data-profile="mariam" onclick="switchProfile('mariam')">مريم</button>
    <button class="nav-tab" data-profile="boudy" onclick="switchProfile('boudy')">بودي</button>
  </div>
</nav>

<div id="loading">جاري معالجة البيانات... ⏳</div>
<main id="app-content"></main>

<script>
/* ─── إعدادات Supabase ─── */
const { createClient } = supabase;
const SUPABASE_URL = 'https://ktdlzqhqccjkolawanui.supabase.co'; 
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0ZGx6cWhxY2Nqa29sYXdhbnVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAxMzIzMzQsImV4cCI6MjA3NTcwODMzNH0.ux62NTzINmgrdkQoqgKZfhdCknUwSgDRdt59pZjOv04';
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ─── الثوابت ─── */
const YEARLY_TARGET_PTS = 21900; 
const MONEY_PER_POINT = 2.25; 

/* ─── حالة التطبيق ─── */
let currentProfile = 'omar';
let membersMap = {}; 
let currentData = [];
let currentAdj = 0;

/* ─── جلب البيانات ─── */
async function initApp() {
  document.getElementById('loading').style.display = 'block';
  const { data, error } = await db.from('family_members').select('*');
  if (data) {
    data.forEach(m => { membersMap[m.member_slug] = m.id; });
    await loadProfileData(currentProfile);
  } else if (error) {
    alert("خطأ في الاتصال بقاعدة البيانات.");
    console.error(error);
  }
}

async function loadProfileData(slug) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('app-content').innerHTML = ''; 
  
  const memberId = membersMap[slug];

  const { data: logs } = await db
    .from('family_daily_logs')
    .select('*')
    .eq('member_id', memberId)
    .order('log_date', { ascending: false });

  const { data: adjs } = await db
    .from('family_points_adjustments')
    .select('adjustment_amount')
    .eq('member_id', memberId);

  currentData = logs || [];
  currentAdj = adjs ? adjs.reduce((sum, item) => sum + item.adjustment_amount, 0) : 0;
  
  document.getElementById('loading').style.display = 'none';
  renderApp();
}

async function switchProfile(p) {
  if (currentProfile === p) return;
  currentProfile = p;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.profile === p));
  await loadProfileData(currentProfile);
}

/* ─── الحسابات ─── */
function calculateStats() {
  let taskPts = 0;
  
  currentData.forEach(e => {
    const itemSum = e.quran_score + e.clean_score + e.study_score + e.respect_score + e.mom_respect_score;
    taskPts += (itemSum + (e.fajr_done ? 10 : 0));
  });

  const totalPts = taskPts + currentAdj;
  const money = totalPts * MONEY_PER_POINT; 
  const progress = (totalPts / YEARLY_TARGET_PTS) * 100;
  
  return { totalPts, money: money.toFixed(2), progress: progress.toFixed(1) };
}

/* ─── الواجهة ─── */
function renderApp() {
  const stats = calculateStats();
  const profileName = currentProfile === 'omar' ? 'عمر' : currentProfile === 'mariam' ? 'مريم' : 'بودي';
  const avatar = currentProfile === 'omar' ? '👦' : currentProfile === 'mariam' ? '👧' : '💸💵';

  const html = `
    <div>
      <div class="profile-header">
        <div class="avatar">${avatar}</div>
        <div class="profile-name" style="color:var(--${currentProfile})">${profileName}</div>
      </div>

      <div class="total-card">
        <div class="progress-container">
          <div style="display:flex; justify-content:space-between; font-weight:bold">
            <span>التقدم نحو الهدف</span>
            <span>${stats.totalPts} / ${YEARLY_TARGET_PTS}</span>
          </div>
          <div class="progress-bg"><div class="progress-fill" style="width:${stats.progress}%"></div></div>
        </div>
        <div style="text-align:center">
          <div style="color:var(--text-dim); font-size:12px">المكافأة المستحقة</div>
          <div style="font-size:32px; font-weight:900; color:var(--green)">${stats.money} <span style="font-size:14px">ج.م</span></div>
        </div>
      </div>

      <h3 style="margin-bottom:15px; color:var(--text-dim)">📜 سجل الأيام</h3>
      ${currentData.length === 0 ? '<div style="text-align:center; color:var(--text-dim);">لا توجد بيانات مسجلة بعد.</div>' : ''}
      ${currentData.map(e => {
        const dPts = e.quran_score + e.clean_score + e.study_score + e.respect_score + e.mom_respect_score + (e.fajr_done ? 10 : 0);
        return `
        <div class="history-item">
          <div>
            <div style="font-weight:bold">${e.log_date}</div>
            <div style="font-size:12px; color:var(--text-dim)">
              نقاط اليوم: ${dPts} من 60
            </div>
          </div>
        </div>
        `
      }).join('')}
    </div>
  `;
  document.getElementById('app-content').innerHTML = html;
}

// بدء التطبيق
initApp();
</script>
</body>
</html>
